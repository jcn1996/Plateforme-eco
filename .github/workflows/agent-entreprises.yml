# Agent entreprises (sans IA) : environ 1 200 sociétés cotées dans les pays suivis.
# - du lundi au vendredi à 22 h 30 UTC : cours, momentum, valorisation, sociétés ayant publié de nouveaux comptes ;
# - le samedi à 3 h 10 UTC : révision complète, découpée en lots (un job par lot, en parallèle), puis assemblage ;
# - après chaque publication : suivi des recommandations (data/historique/recommandations.json) ;
# - à la main : onglet Actions → « Agent entreprises » → « Run workflow » (choisir le mode).
name: Agent entreprises

on:
  schedule:
    - cron: "30 22 * * 1-5"   # quotidien
    - cron: "10 3 * * 6"      # révision complète du samedi
  workflow_dispatch:
    inputs:
      mode:
        description: "quotidien, complet (tous les lots), pays (révision complète des pays indiqués) ou echantillon"
        type: choice
        options: [quotidien, complet, pays, echantillon]
        default: quotidien
      taille:
        description: "Taille de l'échantillon (mode echantillon)"
        default: "60"
      pays:
        description: "Pays à réviser (mode pays), codes séparés par des virgules"
        default: "CO,VN,AE,EG"

permissions:
  contents: write

concurrency:
  group: agent-entreprises
  cancel-in-progress: false

env:
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}

jobs:
  # ---------------------------------------------------------------- quotidien ou échantillon
  simple:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'complet')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r agents/requirements.txt
      - name: Tester l'agent (sans réseau)
        run: python -m unittest discover -s agents/entreprises -t .
      - name: Lancer l'agent entreprises
        run: |
          if [ "${{ inputs.mode }}" = "pays" ]; then
            python -m agents.entreprises --mode complet --pays "${{ inputs.pays }}"
          elif [ "${{ inputs.mode }}" = "echantillon" ]; then
            python -m agents.entreprises --mode complet --echantillon "${{ inputs.taille }}"
          elif [ -f data/entreprises/comptes.json ]; then
            python -m agents.entreprises --mode quotidien
          else
            echo "Pas encore de base de comptes : lancer d'abord le mode « complet »."
            exit 0
          fi
      - name: Commiter (avec le suivi des recommandations)
        run: |
          outils/pousser_avec_suivi.sh "Agent entreprises : mise à jour du $(date -u +%d/%m/%Y)" data/

  # ---------------------------------------------------------------- révision complète : un job par lot
  lots:
    if: (github.event_name == 'schedule' && github.event.schedule == '10 3 * * 6') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'complet')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3   # limite la charge sur Yahoo Finance
      matrix:
        lot: [etats_unis_1, etats_unis_2, ameriques, europe, asie_pacifique, moyen_orient_afrique]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r agents/requirements.txt
      - name: Réviser le lot ${{ matrix.lot }}
        run: python -m agents.entreprises --mode complet --lot ${{ matrix.lot }} --sortie-lot lot-${{ matrix.lot }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: lot-${{ matrix.lot }}
          path: lot-${{ matrix.lot }}.json
          retention-days: 3

  assembler:
    needs: lots
    if: always() && needs.lots.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r agents/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: lots
          merge-multiple: true
      - name: Assembler les lots et publier
        run: python -m agents.entreprises --mode assembler --lots lots/*.json
      - name: Commiter (avec le suivi des recommandations)
        run: |
          outils/pousser_avec_suivi.sh "Agent entreprises : révision complète du $(date -u +%d/%m/%Y)" data/
