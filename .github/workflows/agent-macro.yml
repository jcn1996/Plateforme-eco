# Agent macro (sans IA) : vue d'ensemble de l'économie mondiale (cycle, récession,
# banques centrales, marchés du cycle), puis commit du résultat sur main.
# - automatiquement chaque jour à 6 h 41 UTC (minute décalée : GitHub retarde ou saute
#   souvent les tâches aux minutes rondes ; le workflow « Rattrapage » relance si besoin) ;
# - à la main : onglet Actions → « Agent macro » → « Run workflow ».
name: Agent macro

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-macro
  cancel-in-progress: false

jobs:
  agent-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt (branche main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      - name: Tester l'agent (données de test, sans réseau)
        run: python -m unittest discover -s agents/macro -t .

      - name: Lancer l'agent macro
        env:
          # Facultatif : avec cette clé, FRED est lu par son API ; sinon par le fichier CSV public
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m agents.macro

      - name: Commiter les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro.json data/signaux/ data/historique/macro/ data/recap/ data/journal/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Agent macro : mise à jour du $(date -u +%d/%m/%Y)"
          # main a pu bouger entre-temps : nouvelle tentative en cas de conflit
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
