# Chef d'orchestre : réunit les sorties de tous les agents (« Où investir maintenant, et avec quelle conviction ? »).
# - chaque jour à 7 h 15 UTC : analyse complète, après les agents du matin (briefing, allocation, suivi de performance ;
#   le samedi, revue hebdomadaire data/recap/chef-hebdo-AAAA-MM-JJ.md) ;
# - à 7 h 45 UTC : nouvelle tentative de rédaction du briefing par Gemini si la première a échoué (rien d'autre ne
#   change ; Gemini ne sert qu'à la rédaction : son échec est une information, pas une dégradation) ;
# - toutes les heures (minute 50) de 8 h à 21 h UTC en semaine : mise à jour légère (alertes ; verdicts touchés par
#   un changement de palier de risque, un choc de marché ou un événement géopolitique de gravité ≥ 4) ;
# - lancé par le planificateur (réveil externe) ; ces plannings GitHub restent en secours ;
# - à la main : onglet Actions → « Chef d'orchestre » → « Run workflow ».
name: Chef d'orchestre

on:
  schedule:
    - cron: "15 7 * * *"               # analyse complète quotidienne
    - cron: "45 7 * * *"               # nouvelle tentative de rédaction du briefing par Gemini (si la première a échoué)
    - cron: "50 8-21 * * 1-5"          # mise à jour légère pendant les marchés
  workflow_dispatch:
    inputs:
      mode:
        description: "complet, leger (alertes et verdicts touchés par un événement), ou redaction (nouvelle tentative de rédaction du briefing par Gemini)"
        type: choice
        options: [complet, leger, redaction]
        default: complet
      essai:
        description: "Essai : code de la branche choisie, sur une copie des données, sans commit (pour vérifier une correction)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-chef
  cancel-in-progress: false

jobs:
  agent-chef:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt (branche main ; branche choisie en mode essai)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.essai && github.ref_name || 'main' }}

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install -r agents/requirements.txt
          # Facultatif : dépôt du briefing sur Google Drive (seulement si le secret existe)
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then pip install google-auth==2.40.3; fi

      - name: Tester l'agent et le module commun (données de test, sans réseau ni Gemini)
        run: |
          python -m unittest discover -s agents/chef -t .
          python -m unittest discover -s agents/commun -t .

      - name: Lancer le chef d'orchestre
        env:
          # Facultatif : briefing rédigé par Gemini (budget propre au chef d'orchestre) ; sinon par règles
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Facultatif : dépôt du briefing dans un dossier Google Drive
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "15 7 * * *") MODE=complet ;;
              "45 7 * * *") MODE=redaction ;;
              *) MODE=leger ;;
            esac
          fi
          if [ "${{ inputs.essai }}" = "true" ]; then
            git fetch --depth 1 origin main && mkdir -p "$RUNNER_TEMP/essai" && git archive origin/main data | tar -x -C "$RUNNER_TEMP/essai"
            python -m agents.chef --mode "${MODE:-complet}" --data "$RUNNER_TEMP/essai/data"
          else
            python -m agents.chef --mode "${MODE:-complet}"
          fi

      - name: Commiter les données si elles ont changé
        if: ${{ !inputs.essai }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chef.json data/chef/ data/alertes.json data/historique/chef/ data/recap/ data/journal/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Chef d'orchestre : $(TZ=Europe/Paris date '+%d/%m %H:%M')"
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
