# Agent données alternatives (sans IA) : indicateurs avancés de l'activité réelle (camions, fret, ciment,
# électricité, exportations, offres d'emploi, aéroports, satellites ; attention du public pour les sociétés
# suivies), puis commit du résultat sur main.
# - chaque jour à 5 h 40 UTC : indicateurs quotidiens et hebdomadaires (camions allemands, TSA, fret, offres
#   d'emploi, Google Trends) ; les publications mensuelles (FRED, DBnomics, USGS) sont prises en compte à
#   l'exécution qui suit leur parution ;
# - avant l'agent pays (6 h 11 UTC), qui reprend le score d'activité comme sous-note « Activité réelle » ;
# - lancé par le planificateur (réveil externe) ; ce planning GitHub reste en secours ;
# - à la main : onglet Actions → « Agent données alternatives » → « Run workflow ».
name: Agent données alternatives

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-donnees-alternatives
  cancel-in-progress: false

jobs:
  agent-donnees-alternatives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt (branche main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      - name: Tester l'agent et le module commun (données de test, sans réseau)
        run: |
          python -m unittest discover -s agents/donnees_alternatives -t .
          python -m unittest discover -s agents/commun -t .

      - name: Lancer l'agent données alternatives
        env:
          # Facultatifs : sans clé ou sans adresse, la source correspondante est ignorée
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          SATELLITES_URL: ${{ vars.SATELLITES_URL }}
          COREE_EXPORTS_20J_URL: ${{ vars.COREE_EXPORTS_20J_URL }}
          TAIWAN_COMMANDES_URL: ${{ vars.TAIWAN_COMMANDES_URL }}
        run: python -m agents.donnees_alternatives

      - name: Commiter les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/donnees_alternatives.json data/signaux/ data/historique/donnees_alternatives/ data/recap/ data/journal/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Données alternatives : mise à jour du $(date -u +%d/%m/%Y)"
          # main a pu bouger entre-temps : nouvelle tentative en cas de conflit
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
