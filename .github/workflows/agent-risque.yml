# Agent risque : stress financier mondial (volatilité, crédit, indices officiels de stress, écarts
# souverains, dollar) et par pays, et contradicteur des signaux des autres agents.
# - toutes les heures pendant les heures de marché (7 h 17 à 21 h 17 UTC, en semaine) : marchés,
#   score, signaux et objections du contradicteur ;
# - chaque jour à 22 h 45 UTC : analyse complète (toutes les sources) et récapitulatif du jour
#   (data/recap/risque-AAAA-MM-JJ.md) ;
# - lancé par le planificateur (réveil externe) ; ces plannings GitHub restent en secours ;
# - à la main : onglet Actions → « Agent risque » → « Run workflow ».
name: Agent risque

on:
  schedule:
    - cron: "45 22 * * *"              # analyse complète quotidienne
    - cron: "17 7-21 * * 1-5"          # toutes les heures pendant les heures de marché
  workflow_dispatch:
    inputs:
      mode:
        description: "horaire, ou complet (toutes les sources et récapitulatif du jour)"
        type: choice
        options: [horaire, complet]
        default: horaire
      essai:
        description: "Essai : code de la branche choisie, sur une copie des données, sans commit (pour vérifier une correction)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-risque
  cancel-in-progress: false

jobs:
  agent-risque:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt (branche main ; branche choisie en mode essai)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.essai && github.ref_name || 'main' }}

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      - name: Tester l'agent et le module commun (données de test, sans réseau ni Gemini)
        run: |
          python -m unittest discover -s agents/risque -t .
          python -m unittest discover -s agents/commun -t .

      - name: Lancer l'agent risque
        env:
          # Facultatif : objections rédigées par Gemini (budget propre à l'agent risque) ; sinon par règles
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Facultatif : FRED par son API (sinon fichier CSV public)
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "45 22 * * *" ]; then MODE=complet; fi
          if [ "${{ inputs.essai }}" = "true" ]; then
            git fetch --depth 1 origin main && mkdir -p "$RUNNER_TEMP/essai" && git archive origin/main data | tar -x -C "$RUNNER_TEMP/essai"
            python -m agents.risque --mode "${MODE:-horaire}" --data "$RUNNER_TEMP/essai/data"
          else
            python -m agents.risque --mode "${MODE:-horaire}"
          fi

      - name: Commiter les données si elles ont changé
        if: ${{ !inputs.essai }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/risque.json data/risque/ data/signaux/ data/historique/risque/ data/recap/ data/journal/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Risque : $(TZ=Europe/Paris date '+%d/%m %H:%M')"
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
