# Agent flux commerciaux (sans IA) : commerce de biens entre les pays suivis (arcs du globe),
# d'après le FMI (International Trade in Goods), UN Comtrade en secours, puis commit sur main.
# Ni flux de capitaux, ni dette. Données mensuelles, décalées de 1 à 2 mois : une mise à jour par semaine suffit.
# - chaque mardi à 5 h 23 UTC (minute décalée ; lancé par le planificateur, ce planning reste en secours) ;
# - à la main : onglet Actions → « Agent flux commerciaux » → « Run workflow ».
name: Agent flux commerciaux

on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-flux
  cancel-in-progress: false

jobs:
  agent-flux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt (branche main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      - name: Tester l'agent (données de test, sans réseau)
        run: |
          python -m unittest discover -s agents/flux -t .
          python -m unittest discover -s agents/commun -t .

      - name: Lancer l'agent flux commerciaux
        run: python -m agents.flux

      - name: Commiter les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flux.json data/journal/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Agent flux : mise à jour du $(date -u +%d/%m/%Y)"
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
