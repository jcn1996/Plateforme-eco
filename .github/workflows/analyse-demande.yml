# Analyse à la demande d'une entreprise (sans IA), déclenchée par une issue dont le titre commence par
# « Analyse : » suivi d'un ticker Yahoo (ASML, MC.PA, 7203.T) ou d'un nom (« Hermès »).
# - Seul le propriétaire du dépôt peut lancer une analyse ; pour tout autre auteur, l'issue est fermée
#   avec un message, sans rien lancer.
# - Résultat : data/analyses/<TICKER>.json, data/analyses/index.json, société ajoutée à
#   config/surveillance.json, suivi de la recommandation (data/historique/recommandations.json),
#   commentaire en français sur l'issue, puis fermeture.
# - Le titre de l'issue n'est jamais interpolé dans une commande : il est lu dans le fichier de l'événement.
name: Analyse à la demande

on:
  issues:
    types: [opened]

concurrency:
  group: analyse-demande
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- auteur autre que le propriétaire
  refuser:
    if: startsWith(github.event.issue.title, 'Analyse') && github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Répondre et fermer, sans rien lancer
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "Merci pour cette demande. Les analyses à la demande sont réservées au propriétaire du dépôt : cette issue est fermée sans qu'aucune analyse ne soit lancée."
          gh issue close "$NUMERO" --repo "$GITHUB_REPOSITORY" --reason "not planned"

  # ---------------------------------------------------------------- propriétaire : analyse
  analyser:
    if: startsWith(github.event.issue.title, 'Analyse') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      NUMERO: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r agents/requirements.txt
      - name: Préparer
        run: echo "SORTIE=$RUNNER_TEMP/analyse" >> "$GITHUB_ENV"
      - name: Accuser réception
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "Analyse lancée (résultat dans 2 à 5 minutes) : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
      - name: Analyser
        id: analyse
        run: python -m agents.analyse_demande --evenement "$GITHUB_EVENT_PATH" --sortie "$SORTIE"
      - name: Enregistrer un échec survenu avant l'analyse
        if: always()
        run: |
          SORTIE="${SORTIE:-$RUNNER_TEMP/analyse}"
          if [ ! -f "$SORTIE/resultat.json" ]; then
            python -m agents.analyse_demande --evenement "$GITHUB_EVENT_PATH" --sortie "$SORTIE" --echec "erreur technique avant l'analyse (voir l'onglet Actions)" || true
          fi
      - name: Commiter (avec le suivi des recommandations)
        if: always()
        run: |
          outils/pousser_avec_suivi.sh "Analyse à la demande : issue #$NUMERO" data/analyses data/journal config/surveillance.json
      - name: Répondre et fermer l'issue
        if: always()
        run: |
          SORTIE="${SORTIE:-$RUNNER_TEMP/analyse}"
          if [ -f "$SORTIE/reponse.md" ]; then
            gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body-file "$SORTIE/reponse.md"
            raison=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['fermeture'])" "$SORTIE/resultat.json")
          else
            gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "L'analyse n'a pas pu aboutir (erreur technique). Détail : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            raison="completed"
          fi
          gh issue close "$NUMERO" --repo "$GITHUB_REPOSITORY" --reason "$raison"
