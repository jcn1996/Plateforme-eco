# Agent pays : met à jour data/pays.json avec des données réelles et gratuites
# (FMI, OCDE, BIS, Yahoo Finance), puis commite le résultat sur main.
# - automatiquement chaque jour à 6 h UTC ;
# - à la main : onglet Actions → « Agent pays » → « Run workflow ».
name: Agent pays

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Jamais deux exécutions en même temps
concurrency:
  group: agent-pays
  cancel-in-progress: false

jobs:
  agent-pays:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt (branche main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      - name: Tester l'agent (données de test, sans réseau)
        run: python -m unittest discover -s agents -t .

      - name: Lancer l'agent pays
        env:
          # Facultatif : si ce secret existe, les textes sont rédigés par Gemini ; sinon, par des règles
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m agents.pays

      - name: Commiter les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all data/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Agent pays : mise à jour du $(date -u +%d/%m/%Y)"
          # main a pu bouger pendant l'exécution : on se remet à jour avant d'envoyer
          git pull --rebase origin main
          git push origin HEAD:main
