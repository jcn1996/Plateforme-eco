# Agent pays : met à jour data/pays.json avec des données réelles et gratuites
# (instituts nationaux, banques centrales, FMI, OCDE, BRI, Banque mondiale, Eurostat,
# BCE, Yahoo Finance), avec vérification croisée, puis commite le résultat sur main
# (données, journal des sources et récapitulatif du jour).
# - automatiquement chaque jour à 6 h 11 UTC (minute décalée : GitHub retarde ou saute
#   souvent les tâches aux minutes rondes ; le workflow « Rattrapage » relance si besoin) ;
# - mode « flux » du mardi au samedi à 2 h 07 UTC (22 h 07 à New York en heure d'été, 21 h 07 en
#   hiver), après la publication des parts en circulation et des VL par les émetteurs d'ETF :
#   seul l'indicateur « Flux étrangers » (flux des ETF pays) est mis à jour ;
# - lancé par le planificateur (réveil externe) ; ces plannings GitHub restent en secours ;
# - à la main : onglet Actions → « Agent pays » → « Run workflow ».
name: Agent pays

on:
  schedule:
    - cron: "11 6 * * *"               # exécution complète
    - cron: "7 2 * * 2-6"              # flux des ETF pays, en soirée (heure de New York)
  workflow_dispatch:
    inputs:
      mode:
        description: "complet (tous les indicateurs) ou flux (flux des ETF pays seulement)"
        type: choice
        options: [complet, flux]
        default: complet

permissions:
  contents: write

# Jamais deux exécutions en même temps
concurrency:
  group: agent-pays
  cancel-in-progress: false

jobs:
  agent-pays:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt (branche main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      # Uniquement les tests de l'agent pays et du module commun : un test d'un autre agent
      # ne doit jamais bloquer cet agent en production. L'ensemble des tests tourne sur
      # chaque pull request (workflow « Tests »).
      - name: Tester l'agent (données de test, sans réseau)
        run: |
          python -m unittest discover -s agents/pays -t .
          python -m unittest discover -s agents/commun -t .

      - name: Lancer l'agent pays
        env:
          # Facultatif : si ce secret existe, les textes sont rédigés par Gemini ; sinon, par des règles
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Facultatif : clé gratuite FRED (Réserve fédérale de Saint-Louis) ; sans elle, la source est ignorée
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Facultatif : clé gratuite du BLS (API v2) ; sans elle, l'API v1 sans clé est utilisée
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "7 2 * * 2-6" ]; then MODE=flux; fi
          python -m agents.pays --mode "${MODE:-complet}"

      - name: Commiter les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all data/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Agent pays : mise à jour du $(date -u +%d/%m/%Y)"
          # main a pu bouger entre-temps : nouvelle tentative en cas de conflit
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
