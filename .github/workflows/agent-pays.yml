# Agent pays : met à jour data/pays.json avec des données réelles et gratuites
# (instituts nationaux, banques centrales, FMI, OCDE, BRI, Banque mondiale, Eurostat,
# BCE, Yahoo Finance), avec vérification croisée, puis commite le résultat sur main
# (données, journal des sources et récapitulatif du jour).
# - automatiquement chaque jour à 6 h 11 UTC (minute décalée : GitHub retarde ou saute
#   souvent les tâches aux minutes rondes ; le workflow « Rattrapage » relance si besoin) ;
# - à la main : onglet Actions → « Agent pays » → « Run workflow ».
name: Agent pays

on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Jamais deux exécutions en même temps
concurrency:
  group: agent-pays
  cancel-in-progress: false

jobs:
  agent-pays:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt (branche main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      - name: Tester l'agent (données de test, sans réseau)
        run: python -m unittest discover -s agents -t .

      - name: Lancer l'agent pays
        env:
          # Facultatif : si ce secret existe, les textes sont rédigés par Gemini ; sinon, par des règles
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Facultatif : clé gratuite FRED (Réserve fédérale de Saint-Louis) ; sans elle, la source est ignorée
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Facultatif : clé gratuite du BLS (API v2) ; sans elle, l'API v1 sans clé est utilisée
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python -m agents.pays

      - name: Commiter les données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all data/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Agent pays : mise à jour du $(date -u +%d/%m/%Y)"
          # main a pu bouger entre-temps : nouvelle tentative en cas de conflit
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
