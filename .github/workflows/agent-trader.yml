# Agent trader (démo) : portefeuille VIRTUEL de 100 000 € géré à partir des recommandations du chef d'orchestre.
# Aucun ordre réel, jamais : les ordres sont simulés (premier cours après la décision, frais, écart achat/vente, change).
# - chaque jour de semaine à 7 h 33 UTC : décision, après l'analyse complète du chef d'orchestre (7 h 15) ; les ordres
#   sont exécutés à l'ouverture des marchés concernés ;
# - toutes les heures (minute 5) de 8 h à 21 h UTC en semaine : exécution des ordres en attente, valorisation, stops,
#   prise de bénéfices, sorties sur verdict ou objection, plancher de liquidités ; décision du jour si elle n'a pas pu
#   être prise à 7 h 33 (données du chef d'orchestre pas encore prêtes) ;
# - lancé par le planificateur (réveil externe) ; ces plannings GitHub restent en secours ;
# - à la main : onglet Actions → « Agent trader (démo) » → « Run workflow ».
name: Agent trader (démo)

on:
  schedule:
    - cron: "33 7 * * 1-5"             # décision quotidienne
    - cron: "5 8-21 * * 1-5"           # toutes les heures pendant les marchés
  workflow_dispatch:
    inputs:
      mode:
        description: "horaire (ordres, valorisation, stops ; décision du jour si due), ou decision (forcer la décision)"
        type: choice
        options: [horaire, decision]
        default: horaire
      essai:
        description: "Essai : code de la branche choisie, sur une copie des données, sans commit (pour vérifier une correction)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-trader
  cancel-in-progress: false

jobs:
  agent-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt (branche main ; branche choisie en mode essai)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.essai && github.ref_name || 'main' }}

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      - name: Tester l'agent et le module commun (cours simulés, sans réseau)
        run: |
          python -m unittest discover -s agents/trader -t .
          python -m unittest discover -s agents/commun -t .

      - name: Lancer l'agent trader
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "33 7 * * 1-5" ]; then MODE=decision; else MODE=horaire; fi
          fi
          if [ "${{ inputs.essai }}" = "true" ]; then
            git fetch --depth 1 origin main && mkdir -p "$RUNNER_TEMP/essai" && git archive origin/main data | tar -x -C "$RUNNER_TEMP/essai"
            python -m agents.trader --mode "${MODE:-horaire}" --data "$RUNNER_TEMP/essai/data"
          else
            python -m agents.trader --mode "${MODE:-horaire}"
          fi

      - name: Commiter les données si elles ont changé
        if: ${{ !inputs.essai }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portefeuille.json data/trader/ data/journal/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Trader (démo) : $(TZ=Europe/Paris date '+%d/%m %H:%M')"
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
