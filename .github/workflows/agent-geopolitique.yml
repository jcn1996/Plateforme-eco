# Agent géopolitique : événements géopolitiques (GDELT, sources officielles, presse), analyse par
# Gemini sous quotas gratuits et contrôle des sources, score de risque /100 par pays suivi.
# - toutes les heures à la minute 3 (événements et scores) ;
# - à 6 h 03 UTC : même chose, plus la synthèse du jour (data/recap/geopolitique-AAAA-MM-JJ.md) ;
# - lancé par le planificateur (réveil externe) ; ces plannings GitHub restent en secours ;
# - à la main : onglet Actions → « Agent géopolitique » → « Run workflow ».
name: Agent géopolitique

on:
  schedule:
    - cron: "3 6 * * *"                # synthèse quotidienne (6 h UTC)
    - cron: "3 0-5,7-23 * * *"         # toutes les heures
  workflow_dispatch:
    inputs:
      mode:
        description: "horaire, ou quotidien (écrit aussi la synthèse du jour)"
        type: choice
        options: [horaire, quotidien]
        default: horaire
      essai:
        description: "Essai : code de la branche choisie, sur une copie des données, sans commit (pour vérifier une correction)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-geopolitique
  cancel-in-progress: false

jobs:
  agent-geopolitique:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt (branche main ; branche choisie en mode essai)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.essai && github.ref_name || 'main' }}

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      - name: Tester l'agent (données de test, sans réseau ni Gemini)
        run: python -m unittest discover -s agents/geopolitique -t .

      - name: Lancer l'agent géopolitique
        env:
          # Facultatif : avec ce secret, les événements sont analysés par Gemini (quotas gratuits respectés) ;
          # sans lui, version sans IA signalée dans l'appli
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Facultatif : FRED par son API (sinon fichier CSV public)
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "3 6 * * *" ]; then MODE=quotidien; fi
          if [ "${{ inputs.essai }}" = "true" ]; then
            # Essai : copie des données de main, rien n'est commité
            git fetch --depth 1 origin main && mkdir -p "$RUNNER_TEMP/essai" && git archive origin/main data | tar -x -C "$RUNNER_TEMP/essai"
            python -m agents.geopolitique --mode "${MODE:-horaire}" --data "$RUNNER_TEMP/essai/data"
          else
            python -m agents.geopolitique --mode "${MODE:-horaire}"
          fi

      - name: Commiter les données si elles ont changé
        if: ${{ !inputs.essai }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geopolitique.json data/geopolitique/ data/signaux/ data/historique/geopolitique/ data/recap/ data/journal/
          if git diff --cached --quiet; then
            echo "Aucun changement : pas de commit."
            exit 0
          fi
          git commit -m "Géopolitique : $(TZ=Europe/Paris date '+%d/%m %H:%M')"
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
