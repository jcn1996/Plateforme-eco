# Agent marchés (sans IA) : met à jour data/marches.json avec de vrais cours
# (Yahoo Finance via yfinance ; Stooq en secours ; sinon dernière valeur marquée « ancienne »).
# - toutes les 15 minutes du lundi au vendredi, de 7 h 07 à 22 h 07 UTC (puis pause la nuit) ;
# - toutes les heures le week-end (pour le Bitcoin), à la minute 7 ;
# Minutes décalées (7, 22, 37, 52) : GitHub retarde ou saute souvent les tâches aux minutes rondes.
# Le workflow « Rattrapage » relance l'agent si une exécution prévue manque depuis plus d'une heure.
# - à la main : onglet Actions → « Agent marchés » → « Run workflow ».
# Pas de commit si les valeurs n'ont pas changé.
name: Agent marchés

on:
  schedule:
    - cron: "7,22,37,52 7-21 * * 1-5"   # 7 h 07 → 21 h 52 UTC, en semaine
    - cron: "7 22 * * 1-5"              # 22 h 07 UTC, en semaine
    - cron: "7 * * * 0,6"               # toutes les heures (minute 7) le samedi et le dimanche
  workflow_dispatch:

permissions:
  contents: write

# Jamais deux exécutions en même temps
concurrency:
  group: agent-marches
  cancel-in-progress: false

jobs:
  agent-marches:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer le dépôt (branche main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Installer les dépendances
        run: pip install -r agents/requirements.txt

      - name: Tester l'agent (sans réseau)
        run: python -m unittest discover -s agents/marches -t .

      - name: Lancer l'agent marchés
        run: python -m agents.marches

      - name: Commiter les cours s'ils ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marches.json data/journal/
          if git diff --cached --quiet; then
            echo "Valeurs inchangées : pas de commit."
            exit 0
          fi
          git commit -m "Marchés : $(TZ=Europe/Paris date +%H:%M)"
          # main a pu bouger pendant l'exécution : on se remet à jour avant d'envoyer
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((essai * 5))
          done
          exit 1
